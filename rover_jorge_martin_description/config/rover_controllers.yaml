controller_manager:
  ros__parameters:
    update_rate: 20 
    use_sim_time: true

    rover_base_control:
      type: diff_drive_controller/DiffDriveController
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    scara_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

rover_base_control:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    use_stamped_vel: false
    use_sim_time: true
    publish_rate: 50.0
    left_wheel_names: ["rover_Rueda_1_I_joint", "rover_Rueda_2_I_joint", "rover_Rueda_3_I_joint"]
    right_wheel_names: ["rover_Rueda_1_D_joint", "rover_Rueda_2_D_joint", "rover_Rueda_3_D_joint"]
    wheel_separation: 0.55672
    wheel_radius: 0.375
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    base_frame_id: base_footprint
    enable_odom_tf: true
    publish_limited_velocity: true
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 5.0
        has_acceleration_limits: true
        max_acceleration: 5.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 5.0
        has_acceleration_limits: true
        max_acceleration: 5.0


scara_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - rover_Brazo2_link_joint
      - rover_Brazo3_link_joint
      - rover_Brazo4_link_joint
      - rover_Muneca_link_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
      - effort
    allow_nonzero_velocity_at_trajectory_end: true

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - rover_Dedo_drch_link_joint
      - rover_Dedo_izq_link_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
      - effort
    allow_nonzero_velocity_at_trajectory_end: true