# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
use_sim_time: true

moveit_simple_controller_manager:
  controller_names:
    - scara_controller
    - gripper_controller

  scara_controller:
    type: FollowJointTrajectory
    joints:
      - rover_Brazo2_link_joint
      - rover_Brazo3_link_joint
      - rover_Brazo4_link_joint
      - rover_Muneca_link_joint
    action_ns: follow_joint_trajectory
    default: true
    use_sim_time: true
  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - rover_Dedo_drch_link_joint
      - rover_Dedo_izq_link_joint
    action_ns: follow_joint_trajectory
    default: true
    use_sim_time: true